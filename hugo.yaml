# OINK Starter — the only site configuration file.
# Change the two marked values first; everything else builds as-is.

title: &siteTitle CASSA # one shared title for every language
baseURL: https://cassa.au/ # canonical production URL
defaultContentLanguage: en
disableLanguages: [zh, fr]
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: Australia/Perth

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: *siteTitle
    params:
      description: Computing and Security Student Association (CASSA)

# OINK's Markdown components depend on these three Goldmark settings.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  github_repo: https://github.com/CASSA/static-CASSA-website
  copyright:
    authors: CASSA
    from_year: 2026
  footer_center_info: ''
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    blog_index_columns: 3
    blog_index_size: 6
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
    navbar_autohide: false
    breadcrumb: true
    # theme_color: '#343e44'
    # typography: system # Set the website default font
    image_zoom: true
    # share: [discord, instagram, copy]
    # feedback:
    #   enable: true
    #   reasons: true

    # Search Bar
    quick_links: [about, timeline, blog]
    page_context_menu:
      enable: true
      assistant_links: false

  # Optional repository links. Uncomment after creating your own repository.
  # github_repo: https://github.com/OWNER/REPOSITORY
  # github_branch: main

  # Optional brand assets. The starter already supplies a neutral logo.
  logo: icons/logo.png
  # Replace the word CASSA next to the logo with an image
  # wordmark: icons/wordmark.svg

  # Optional Giscus comments. Nothing is loaded until the entire block is set.
  # comments:
  #   enable: true
  #   type: giscus
  #   giscus:
  #     repo: OWNER/REPOSITORY
  #     repoId: R_xxxxxxxxxx
  #     category: Announcements
  #     categoryId: DIC_xxxxxxxxxx
  #     mapping: pathname
  #     inputPosition: bottom
  #     theme: auto
  #     loading: lazy

  # Optional layout choice. Theme defaults remain active while commented.
  # page_width: wide

# Optional Google Analytics. Production builds only; previews stay untracked.
# services:
#   googleAnalytics:
#     id: G-XXXXXXXXXX

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1